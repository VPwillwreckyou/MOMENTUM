name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root
      - name: Unit tests
        run: npm run test:web
      - name: Build
        run: npm run build

  api:
    name: Java API build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compile main sources and build jar
        run: |
          mkdir -p services/api/build/classes services/api/build/test-classes
          find services/api/src/main/java -name '*.java' > /tmp/sources.txt
          javac --release 21 -encoding UTF-8 -d services/api/build/classes @/tmp/sources.txt
          printf 'Manifest-Version: 1.0\nMain-Class: dev.momentum.MomentumServer\nImplementation-Title: MOMENTUM API\nImplementation-Version: 1.0.0\n' > services/api/build/manifest.txt
          jar --create --file services/api/build/momentum-api.jar --manifest services/api/build/manifest.txt -C services/api/build/classes .
      - name: Download runtime dependencies
        run: |
          mkdir -p services/api/lib
          curl --fail --silent --show-error --location https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.45.1.0/sqlite-jdbc-3.45.1.0.jar -o services/api/lib/sqlite-jdbc.jar
          curl --fail --silent --show-error --location https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.9/slf4j-api-2.0.9.jar -o services/api/lib/slf4j-api.jar
      - name: Compile and run Java tests
        run: |
          find services/api/src/test/java -name '*.java' > /tmp/test-sources.txt
          TEST_CP="services/api/build/classes:services/api/lib/sqlite-jdbc.jar:services/api/lib/slf4j-api.jar"
          javac --release 21 -encoding UTF-8 -cp "$TEST_CP" -d services/api/build/test-classes @/tmp/test-sources.txt
          java -ea -cp "$TEST_CP:services/api/build/test-classes" dev.momentum.TestRunner
